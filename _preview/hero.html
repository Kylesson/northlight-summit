<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero option</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--field:#2433D6;--paper:#F3EFE6;--ink:#17151F;--acid:#E4FF3A;--muted:#4A4766}
*{box-sizing:border-box;margin:0}
body{background:var(--field);color:var(--paper);font:17px/1.55 Onest,sans-serif;overflow:hidden}
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;padding:0 16px;isolation:isolate;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;height:64px;font-weight:600}
.mark{font:500 clamp(12px,3.4vw,15px) Unbounded;white-space:nowrap;letter-spacing:-.02em;margin-right:auto}
.lang{display:flex;border:1.5px solid var(--paper);border-radius:999px;padding:3px}
.lang b{font:600 13px Onest;padding:6px 10px;border-radius:999px}
.lang b:first-child{background:var(--paper);color:var(--field)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--acid);color:var(--ink);font:600 15px Onest;border-radius:999px;padding:0 14px;height:44px;text-decoration:none}
.fit{font-family:Unbounded;font-weight:800;line-height:.86;letter-spacing:-.02em;white-space:nowrap;display:block;width:max-content}
.sub{font:500 clamp(18px,3.2vw,40px) Unbounded;letter-spacing:-.02em}
.promise{font-size:clamp(17px,1.6vw,22px);max-width:30ch}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{border:1.5px solid currentColor;border-radius:999px;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums}
@media (min-width:768px){.hero{padding:0 40px}.bar{height:80px}}

/* A: crossfade shape, title on the floor, full-width CTA bar */
.a .shape{position:absolute;inset:-10% 30% 25% -20%;background:var(--acid);border-radius:50%;z-index:-1;
  -webkit-mask:linear-gradient(105deg,#000 30%,transparent 78%);mask:linear-gradient(105deg,#000 30%,transparent 78%)}
.a .body{margin-top:auto;display:grid;gap:18px;padding-bottom:16px}
.a .promise{color:var(--paper)}
.a .cta{display:flex;justify-content:space-between;align-items:center;background:var(--acid);color:var(--ink);
  margin:0 -16px;padding:0 16px;height:64px;font:800 clamp(17px,2vw,26px) Unbounded;text-decoration:none;letter-spacing:-.02em}
@media (min-width:768px){.a .cta{margin:0 -40px;padding:0 40px;height:88px}}

/* B: title on top, yellow disc bottom-right, info grid */
.b .fit{margin-top:24px}
.b .shape{position:absolute;width:min(90vw,880px);aspect-ratio:1;right:-22%;bottom:-38%;border-radius:50%;z-index:-1;
  background:radial-gradient(circle at 35% 35%,var(--acid) 0 45%,color-mix(in oklab,var(--acid) 40%,var(--field)) 62%,transparent 71%)}
.b .grid{margin-top:auto;display:grid;gap:16px;padding-bottom:24px}
.b .row{display:grid;grid-template-columns:repeat(3,auto);gap:16px 28px;justify-content:start}
.b .row div{font:500 clamp(15px,1.5vw,20px) Unbounded;letter-spacing:-.02em}
.b .row small{display:block;font:400 13px Onest;opacity:.85}
.b .btn{height:56px;font-size:17px;padding:0 28px;justify-self:start}

/* C: two-line title, yellow half-field, text flips colour where it crosses (difference blend) */
.c .shape{position:absolute;left:0;right:0;bottom:0;height:46%;background:var(--acid);z-index:-1;
  -webkit-mask:linear-gradient(180deg,transparent,#000 10%);mask:linear-gradient(180deg,transparent,#000 10%)}
.c .title{margin-top:auto;mix-blend-mode:difference;color:#DBDDFF}
.c .title .fit{line-height:.82}
.c .foot{display:grid;gap:14px;padding:22px 0 24px;color:var(--ink)}
.c .meta span{border-color:var(--ink)}
.c .btn{background:var(--ink);color:var(--acid);height:56px;font-size:17px;padding:0 28px;justify-self:start}
@media (min-width:768px){.c .foot{grid-template-columns:1fr auto auto;align-items:end;gap:28px}}
</style>
</head>
<body>
<section class="hero" id="h">
  <header class="bar"><span class="mark">Northlight Summit</span><span class="lang"><b>EN</b><b>RU</b></span><a class="btn" href="#">Register</a></header>
</section>
<script>
const v=new URLSearchParams(location.search).get('v')||'a';
const h=document.getElementById('h');h.classList.add(v);
const T={
a:`<div class="shape"></div><div class="body">
  <p class="promise">One Saturday where design and code finally meet.</p>
  <div class="meta"><span>Sat 17 April 2027</span><span>Riga, Latvia</span></div>
  <div><span class="fit">NORTHLIGHT</span><span class="sub">Summit 2027</span></div></div>
  <a class="cta" href="#"><span>Register</span><span>from €89</span></a>`,
b:`<div class="shape"></div><span class="fit">NORTHLIGHT</span><span class="sub">Design + Code Summit</span>
  <div class="grid"><p class="promise">One Saturday where design and code finally meet.</p>
  <div class="row"><div>17.04.27<small>Saturday, 09:30</small></div><div>Riga<small>Depot 7, Old Rail Yard</small></div><div>€89<small>tickets from</small></div></div>
  <a class="btn" href="#">Register</a></div>`,
c:`<div class="shape"></div><div class="title"><span class="fit">NORTH</span><span class="fit">LIGHT</span></div>
  <div class="foot"><p class="promise">One Saturday where design and code finally meet.</p>
  <div class="meta"><span>Sat 17 April 2027</span><span>Riga</span><span>from €89</span></div>
  <a class="btn" href="#">Register</a></div>`};
h.insertAdjacentHTML('beforeend',T[v]);
// fit each .fit to the hero's inner width
function fit(){const w=h.clientWidth-parseFloat(getComputedStyle(h).paddingLeft)*2;
  h.querySelectorAll('.fit').forEach(e=>{e.style.fontSize='100px';e.style.fontSize=100*w/e.scrollWidth+'px'})}
document.fonts.ready.then(fit);addEventListener('resize',fit);
</script>
</body>
</html>
